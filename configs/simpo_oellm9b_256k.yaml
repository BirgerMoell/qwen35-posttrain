# SimPO — OELLM-9B-256K. Reference-free preference training on EU exam pairs.
# STAGE_LOAD is overridden with the completed SFT artifact.
model_name_or_path: /scratch/project_465002530/users/bmoell/qwen35-posttrain/output/oellm9b-256k-sft
torch_dtype: bfloat16
attn_implementation: flash_attention_2
datasets:
  - path: parquet
    data_files: {train: /scratch/project_465002530/users/bmoell/posttrain-data/exam-dpo-parquet/train.parquet}
    split: train
output_dir: /scratch/project_465002530/users/bmoell/qwen35-posttrain/output/oellm9b-256k-simpo
loss_type: simpo
cpo_alpha: 0.0
simpo_gamma: 0.5
beta: 2.0
max_length: 1024
max_prompt_length: 768
max_steps: 1500
dataset_num_proc: 8
ddp_timeout: 18000
# SimPO concatenates chosen/rejected sequences, so a pair microbatch of 2 can transiently require
# four near-max-length sequences per rank. Keep the global pair batch at 128 while halving peak
# activation memory: 16 ranks * 1 pair/rank * 8 accumulation steps = 128 pairs/update.
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
logging_steps: 20
save_steps: 500
save_total_limit: 3
report_to: none
