# SFT v2 — Qwen3.5-9B-EU, the AMBITIOUS flagship run. Full general set (1.08M) + a heavier
# reasoning share (250k, ~80/20 — it's the reasoning flagship), longer, MULTI-NODE.
# Designed for 4 nodes x 8 GPUs = 32 GPUs (grad_accum 4 -> global batch 128). Fresh full FT.
# 9B is fine on CPU RAM (18 GB/rank x 8 = 144 GB/node << 480) — no 27B-style meta-load needed.

model_name_or_path: /scratch/project_465002530/users/bmoell/models/Qwen3.5-9B
torch_dtype: bfloat16

datasets:
  - path: parquet
    data_files:
      train: /scratch/project_465002530/users/bmoell/posttrain-data/qwen35-9b-sft-parquet/train.parquet
    split: train                   # full general EU set (~1.08M), no-think
  - path: parquet
    data_files:
      train: /scratch/project_465002530/users/bmoell/posttrain-data/qwen35-9b-reasoning-sft-parquet/train.parquet
    split: "train[:250000]"        # ~20% reasoning (think-format) — flagship reasoning emphasis

output_dir: /scratch/project_465002530/users/bmoell/qwen35-posttrain/output/qwen35-9b-eu-sft-v2
max_length: 4096
packing: true
dataset_num_proc: 6                # fewer packing workers — 16 x many ranks OOMed CPU RAM at 9B
ddp_timeout: 18000
max_steps: 3000
per_device_train_batch_size: 1
gradient_accumulation_steps: 4     # global batch 128 on 8 nodes x 4 GPUs (32 procs x 4) — same
                                   # recipe as the 16-GPU run, just 2x GPUs so 3000 steps fit <24h
learning_rate: 6.0e-6              # lower for the larger model + longer schedule
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
logging_steps: 20
save_steps: 1000
save_total_limit: 3
report_to: none
