# GRPO / RLVR — Qwen3.5-4B-EU tool-use stage. Verifiable tool_call_exact reward (structure + name
# + args), beta=0. Loads from the v-next SFT checkpoint. STAGE_LOAD can override.

model_name_or_path: /scratch/project_465002530/users/bmoell/qwen35-posttrain/output/qwen35-4b-eu-sft-vnext
torch_dtype: bfloat16

dataset_name: /scratch/project_465002530/users/bmoell/posttrain-data/eu-tooluse-parquet/grpo/train.jsonl

output_dir: /scratch/project_465002530/users/bmoell/qwen35-posttrain/output/qwen35-4b-eu-tooluse-grpo
num_generations: 8
max_prompt_length: 2048            # tool schemas in the system turn are long
max_completion_length: 256         # a <tool_call> json block (vs 64 for MCQ letters)
temperature: 0.9
beta: 0.0
use_vllm: false
max_steps: 500
ddp_timeout: 14400
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
logging_steps: 5
save_steps: 200
save_total_limit: 2
report_to: none
