# Stage 4b DPO on W3 (OELLM_RL_RUN_PROGRAM.md 10.6, OELLM_HALLUCINATION_PLAN.md): repair W3's abstention collapse and
# add identity and refusal calibration in one checkpoint. Data (slurm/stage4b_assemble_leonardo.sbatch):
# abstention repair pairs sampled on W3 (60 % "answer what you know", reference = W2's consistent answers), identity
# and reduced-safety pairs judged on W3, plus 4,000 general Stage-4 pairs. One epoch, LR 5e-7 (the W2 pilot at 1e-6
# overshot), 10 % warmup, global batch 128 on 2 nodes at 1 pair per GPU.
model_name_or_path: ${OELLM_SCRATCH}/oellm-upload/oellm-9b-256k-stage5-w3-rl-step160
dtype: bfloat16
attn_implementation: flash_attention_2
output_dir: ${OELLM_SCRATCH}/oellm-dpo/output/stage4b-w3
loss_type: [sigmoid]
beta: 0.1
max_length: 2048
num_train_epochs: 1
per_device_train_batch_size: 1   # 2 OOMed at step 2 on 2 nodes (job 63227208)
per_device_eval_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.0
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
seed: 42
data_seed: 42
logging_steps: 1
eval_strategy: steps
eval_steps: 10
save_strategy: steps
save_steps: 1000                # pilot: final save only
save_total_limit: 1
dataloader_num_workers: 2
ddp_timeout: 7200
report_to: none
