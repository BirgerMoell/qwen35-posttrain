# Five-step validation of the production OELLM-9B-256K SFT path on one LUMI node.
# Submit with RANK0_META_LOAD=1; per-rank loading OOMs the 480 GB node.
model_name_or_path: /scratch/project_465002530/users/bmoell/models/oellm-9b-256k-chat
torch_dtype: bfloat16
attn_implementation: flash_attention_2
datasets:
  - path: parquet
    data_files: {train: /scratch/project_465002530/users/bmoell/posttrain-data/qwen35-9b-sft-parquet/train.parquet}
    split: "train[:4096]"
output_dir: /scratch/project_465002530/users/bmoell/qwen35-posttrain/output/oellm9b-256k-sft-smoke
eos_token: <end_of_turn>
max_length: 2048
packing: true
dataset_num_proc: 4
ddp_timeout: 3600
max_steps: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
lr_scheduler_type: constant_with_warmup
warmup_steps: 1
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
logging_steps: 1
save_steps: 5
save_total_limit: 1
report_to: none
