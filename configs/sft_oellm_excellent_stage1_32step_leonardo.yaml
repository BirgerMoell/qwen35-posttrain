# First checkpointed training slice on the full-corpus, direct-answer build.
# The Slurm launcher selects deterministic warmup and validation files by glob.
model_name_or_path: /leonardo_work/AIFAC_F02_352/pmoell00/sft-migration-preflight/base-256k-anneal300b
dtype: bfloat16
attn_implementation: flash_attention_2
datasets:
  - path: json
    data_files:
      train: /leonardo_work/AIFAC_F02_352/pmoell00/sft-migration-preflight/data/excellent-stage1-full-v1/warmup-*.jsonl
    split: train
output_dir: /leonardo_work/AIFAC_F02_352/pmoell00/sft-migration-preflight/output/excellent-stage1-32step-v1
eos_token: <|im_end|>
assistant_only_loss: true
max_length: 4096
packing: false
dataset_num_proc: 4
ddp_timeout: 1800
seed: 42
data_seed: 42
max_steps: 32
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-6
lr_scheduler_type: constant
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
logging_steps: 1
eval_strategy: steps
eval_steps: 16
save_strategy: steps
save_steps: 16
save_total_limit: 2
save_only_model: true
report_to: none
