# NeMo Gym config overlay for slurm/nemo_gym_baseline_leonardo.sbatch (copied to $GYM/oellm-baseline/oellm.yaml).
# Policy: the checkpoint served by vLLM on 127.0.0.1:8000 as "agora" (direct mode, chat completions).
# Judge: gemma4:31b (EUROPA judge digest) through Ollama's OpenAI-compatible API on 127.0.0.1:11434.
policy_base_url: http://127.0.0.1:8000/v1
policy_api_key: EMPTY
policy_model_name: agora
skip_venv_if_present: true     # compute nodes are offline: reuse the prebuilt .venv links
policy_model:
  responses_api_models:
    vllm_model:
      uses_reasoning_parser: false
      uses_interleaved_reasoning: false
      use_completions_api: false
judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:11434/v1
      api_key: ollama
      model: gemma4:31b
      return_token_id_information: false
      uses_reasoning_parser: true    # gemma4 returns a reasoning field via Ollama; false makes NeMo Gym assert
      uses_interleaved_reasoning: false
      use_completions_api: false
      chat_template_kwargs: null
      extra_body: null
verifif:
  resources_servers:
    verifif:
      judge_base_url: http://127.0.0.1:11434/v1
      judge_api_key: ollama
      judge_model: gemma4:31b
      judge_temperature: 0.0
      judge_top_p: 1.0
      judge_max_tokens: 2048
abstention:
  resources_servers:
    abstention:
      judge_model_server:
        type: responses_api_models
        name: judge_model
