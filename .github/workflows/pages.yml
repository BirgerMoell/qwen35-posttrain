name: Publish post-training docs

on:
  push:
    branches: [main]
    paths:
      - "docs/OELLM_POST_TRAINING_ROADMAP.md"
      - "docs/OELLM_POST_TRAINING_PLAYBOOK.md"
      - "docs/OELLM_RL_RUN_PROGRAM.md"
      - "docs/OELLM_STAGE5_RL_PLAN.md"
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only the post-training plan documents)
        run: |
          mkdir -p site
          cp pages/* site/
          cp docs/OELLM_POST_TRAINING_ROADMAP.md docs/OELLM_POST_TRAINING_PLAYBOOK.md \
             docs/OELLM_RL_RUN_PROGRAM.md docs/OELLM_STAGE5_RL_PLAN.md site/
          if grep -nE "pmoell00|aifac_f02_352|AIFAC_F02_352|userexternal" site/*.md; then
            echo "personal paths or account names in the published documents" >&2; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
